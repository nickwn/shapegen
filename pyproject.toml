[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bottlegen"
version = "0.0.1"
description = "Genus-0 bottle generator via inverse Willmore flow"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "libigl",       # AABB point-mesh queries in geom/resample.py
    "matplotlib",   # scripts/plot_sh_roundtrip.py -- was used but undeclared
    "torch",        # bottlegen/models/ -- core since the flow model landed
    "pymeshlab",    # isotropic remesh before cMCF; worth 25-32% of reconstruction
]

[project.optional-dependencies]
# Interactive inspection. Not importable headless (needs a GL context), so it is
# deliberately optional -- but a scalar field drawn on the mesh is how several
# bugs in this codebase were eventually found, after summary statistics hid them.
viz = ["polyscope"]
# spherical + quaternionic: independent SWSH oracle (tests) and, later, the
# Wigner-D rotation augmentation. Not required at runtime.
spectral = ["spherical", "quaternionic"]
dev = ["pytest", "spherical", "quaternionic"]

[tool.setuptools.packages.find]
include = ["bottlegen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
