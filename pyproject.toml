[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bottlegen"
version = "0.0.1"
description = "Genus-0 bottle generator via inverse Willmore flow"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
# Networks / data / geometry pipeline (added in later sessions).
nets = ["torch", "einops", "omegaconf"]
geom = ["trimesh", "pymeshlab", "robust-laplacian", "polyscope"]
# spherical + quaternionic: independent SWSH oracle (tests) and, later, the
# Wigner-D rotation augmentation. Not required at runtime.
spectral = ["spherical", "quaternionic"]
dev = ["pytest", "spherical", "quaternionic"]

[tool.setuptools.packages.find]
include = ["bottlegen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
