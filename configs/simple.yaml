# Simple model — SWSH degree-tokenized cold-diffusion DiT (Session 7).
# Loaded with OmegaConf; override on the CLI, e.g.  L=24 train.steps=20000

L: 16                     # bandlimit (state lives in ℓ ∈ [2, L])
cache_dir: cache          # cached bottle σ̂ records (built by the data stage)
base_subdiv: 5            # base icosphere subdivision for the Dirac decode (10242 v)

model:
  d: 384                  # token width  (~22 M params at depth 12)
  depth: 12
  heads: 6
  t_embed: 256

flow:
  top_band_damp: 1.0e-3   # t_max so the top degree damps to this at t_max

train:
  steps: 20000
  batch: 256
  lr: 3.0e-4
  weight_decay: 1.0e-4
  ema_decay: 0.999
  sobolev_beta: 1.0
  whiten: true            # whiten the Sobolev loss by per-degree RMS
  rotate_aug: true        # free Wigner-D rotation augmentation
  seed: 0
  warmup: 500
  log_every: 200
  ckpt: runs/simple/ema.pt

sample:
  n: 16
  steps: 64               # T cold-diffusion restoration steps
  noise: 0.0              # optional per-step diversity noise
  out_dir: reports/simple
