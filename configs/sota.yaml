# SOTA model — DiffusionNet set-latent VAE (Session 9) + rectified flow (S10).
# Loaded with OmegaConf; override on the CLI.

L: 16
cache_dir: cache
base_subdiv: 5
lb_k: 64                   # LB eigenbasis size cached per mesh

vae:
  in_ch: 6                 # per-vertex input features (xyz + normals)
  C: 128                   # DiffusionNet channel width
  M: 32                    # number of latent set tokens
  zdim: 16                 # latent dim per token
  n_blocks: 4              # DiffusionNet blocks
  dec_d: 256               # σ̂ decoder width
  heads: 8
  dec_depth: 2

train:
  steps: 4000
  batch: 16
  lr: 1.0e-3
  weight_decay: 1.0e-4
  beta: 1.0e-4             # KL weight (β-annealed)
  beta_warmup: 1000
  sobolev_beta: 1.0
  whiten: false           # match raw σ̂ amplitudes (whitening over-weights noise)
  seed: 0
  demo_n: 16
  log_every: 200
  ckpt: runs/sota/vae.pt

rf:                       # rectified flow over the frozen VAE latents (S10)
  mode: vanilla           # vanilla | physics
  d: 256
  depth: 6
  heads: 8
  t_embed: 128
  steps: 8000
  batch: 64
  lr: 1.0e-3
  ema_decay: 0.999
  seed: 0
  log_every: 200
  vae_ckpt: runs/sota/vae.pt
  ckpt: runs/sota/rf.pt

sample:
  n: 16
  steps: 64               # Heun ODE steps
  out_dir: reports/sota
